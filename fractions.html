<script>'use strict';
const root=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fraction(s){const [a,b]=String(s).split('/');return b?`<span class="fraction" aria-label="${esc(a)} из ${esc(b)}"><span class="num">${esc(a)}</span><span class="den">${esc(b)}</span></span>`:esc(s);}


const lab={d:4,wholes:1,parts:new Set([0,1,2]),refined:false,figure:0};
const LAB_MAX_WHOLES=9;
const LAB_DIVISIONS=[1,2,3,4,6,8,12];
const LAB_FIGURES=[
  {id:'circle',label:'Круг',tone:'mint'},
  {id:'square',label:'Плитки',tone:'lilac'},
  {id:'triangle',label:'Треугольник',tone:'coral'},
  {id:'strip',label:'Полоска',tone:'sky'},
  {id:'objects',label:'Бусины',tone:'gold'}
];

function labHit(model,i,unit=0){const index=unit*lab.d+i;return `class="lab-hit" data-lab-part="${index}" data-lab-model="${model}" role="button" tabindex="0" aria-label="${model==='objects'?'Группа':'Доля'} ${i+1} из ${lab.d}${lab.wholes>1?', целое '+(unit+1)+' из '+lab.wholes:''}: ${model==='circle'?'круг':model==='triangle'?'треугольник':model==='square'?'плитки':model==='strip'?'полоска':'бусины'}" aria-pressed="${lab.parts.has(index)}"`;}
function labSVG(model,body,box='0 0 180 180'){
  const names={circle:'Круг',triangle:'Треугольник',square:'Плитки',objects:'Бусины',strip:'Полоска'};
  const contours={
    circle:'M90 14A76 76 0 1 1 90 166A76 76 0 1 1 90 14Z',
    triangle:`M${labTriangleParts(1)[0].map(p=>p.join(' ')).join('L')}Z`,
    square:'M13 13H167V167H13Z',objects:'M10 10H170V170H10Z',strip:'M0 5H600V55H0Z'
  };
  return `<svg viewBox="${box}" class="lab-figure" role="group" aria-label="${names[model]}: ${lab.d===1?'одно целое без деления':lab.d+' равных частей'}">${body}<path class="lab-outline" d="${contours[model]}" aria-hidden="true"/></svg>`;
}
// As in the tutor, adjoining fills share one thin divider, without gaps between parts.
function labDividers(path){return path?`<path class="lab-divider" d="${path}" aria-hidden="true"/>`:'';}
function labGridDividers(cols,rows,x,y,width,height){
  let path='';
  for(let col=1;col<cols;col++)path+=`M${x+col*width/cols} ${y}V${y+height}`;
  for(let row=1;row<rows;row++)path+=`M${x} ${y+row*height/rows}H${x+width}`;
  return labDividers(path);
}
function labTriangleDividers(parts){
  const pointKey=p=>p.map(v=>v.toFixed(7)).join(',');
  const vertices=[...new Map(parts.flat().map(p=>[pointKey(p),p])).values()],edges=new Map();
  for(const part of parts)part.forEach((a,i)=>{
    const b=part[(i+1)%part.length],dx=b[0]-a[0],dy=b[1]-a[1],length2=dx*dx+dy*dy;
    // At a T junction, one long edge adjoins two shorter edges. Split them
    // at every shared vertex before counting, so no internal boundary is lost.
    const cuts=vertices.map(p=>({p,t:((p[0]-a[0])*dx+(p[1]-a[1])*dy)/length2}))
      .filter(({p,t})=>t>=-1e-9&&t<=1+1e-9&&Math.abs(dx*(p[1]-a[1])-dy*(p[0]-a[0]))<1e-7*Math.sqrt(length2))
      .sort((u,v)=>u.t-v.t);
    for(let j=1;j<cuts.length;j++){
      const start=cuts[j-1].p,end=cuts[j].p,key=[pointKey(start),pointKey(end)].sort().join('|');
      const edge=edges.get(key);if(edge)edge.count++;else edges.set(key,{a:start,b:end,count:1});
    }
  });
  return labDividers([...edges.values()].filter(edge=>edge.count===2).map(({a,b})=>`M${a.join(' ')}L${b.join(' ')}`).join(''));
}
function labTriangleParts(count){
  const top=[90,22],left=[12,22+78*Math.sqrt(3)],right=[168,left[1]];
  const midpoint=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const quarters=([a,b,c])=>{const ab=midpoint(a,b),ac=midpoint(a,c),bc=midpoint(b,c);return [[a,ab,ac],[ab,b,bc],[ac,ab,bc],[ac,bc,c]];};
  const halves=([a,b,c])=>{const m=midpoint(b,c);return [[a,b,m],[a,m,c]];};
  const thirds=([a,b,c])=>{const center=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3];return [[a,b,center],[b,c,center],[c,a,center]];};
  const whole=[top,left,right];
  // Each layout consists of congruent triangles. For 8 and 12, subdivide
  // four equilateral quarters instead of converging every cut at one tip.
  if(count===1)return [whole];
  if(count===2)return halves(whole);
  if(count===3)return thirds(whole);
  if(count===4)return quarters(whole);
  if(count===6)return thirds(whole).flatMap(([a,b,center])=>halves([center,a,b]));
  if(count===8)return quarters(whole).flatMap(halves);
  if(count===12)return quarters(whole).flatMap(thirds);
  throw new RangeError('Unsupported triangle partition');
}
function labWholeSVG(model,unit=0){
  const d=lab.d;let circle='',triangle='',square='',objects='',strip='';
  const triangleParts=labTriangleParts(d);
  const cols=d===1?1:d===2?2:d===3?3:d===4?2:d===6?3:4,rows=d/cols;
  const objCols=d===1?1:d===3?3:d<=4?2:d===6?3:4,objRows=d/objCols,objW=160/objCols,objH=160/objRows;
  for(let i=0;i<d;i++){
    const start=i*2*Math.PI/d-Math.PI/2,end=(i+1)*2*Math.PI/d-Math.PI/2;
    circle+=d===1?`<circle ${labHit('circle',i,unit)} cx="90" cy="90" r="76"/>`:`<path ${labHit('circle',i,unit)} d="M90 90L${90+76*Math.cos(start)} ${90+76*Math.sin(start)}A76 76 0 ${end-start>Math.PI?1:0} 1 ${90+76*Math.cos(end)} ${90+76*Math.sin(end)}Z"/>`;
    triangle+=`<path ${labHit('triangle',i,unit)} d="M${triangleParts[i].map(p=>p.join(' ')).join('L')}Z"/>`;
    square+=`<rect ${labHit('square',i,unit)} x="${13+i%cols*154/cols}" y="${13+Math.floor(i/cols)*154/rows}" width="${154/cols}" height="${154/rows}"/>`;
    const x=10+i%objCols*objW,y=10+Math.floor(i/objCols)*objH,per=24/d,dotCols=d===1?6:per<=3?per:per===4?2:3,dotRows=Math.ceil(per/dotCols),step=Math.min((objW-14)/dotCols,(objH-12)/dotRows,20),radius=Math.min(6,step*.31);
    objects+=`<g ${labHit('objects',i,unit)}><rect class="lab-group-bound" x="${x}" y="${y}" width="${objW}" height="${objH}"/>${Array.from({length:per},(_,j)=>`<circle class="lab-bead" cx="${x+objW/2+(j%dotCols-(dotCols-1)/2)*step}" cy="${y+objH/2+(Math.floor(j/dotCols)-(dotRows-1)/2)*step}" r="${radius}"/>`).join('')}</g>`;
    strip+=`<g ${labHit('strip',i,unit)}><rect x="${i*600/d}" y="5" width="${600/d}" height="50"/><path class="lab-subcut" d="M${(i+.5)*600/d} 5V55"/></g>`;
  }
  circle+=d===1?'':labDividers(Array.from({length:d},(_,i)=>{const angle=i*2*Math.PI/d-Math.PI/2;return `M90 90L${90+76*Math.cos(angle)} ${90+76*Math.sin(angle)}`;}).join(''));
  triangle+=labTriangleDividers(triangleParts);
  square+=labGridDividers(cols,rows,13,13,154,154);
  objects+=labGridDividers(objCols,objRows,10,10,160,160);
  strip+=labGridDividers(d,1,0,5,600,50);
  const models={circle,triangle,square,objects,strip};
  return labSVG(model,models[model],model==='strip'?'0 -30 600 120':'0 0 180 180');
}
function mountLab(){
  const d=lab.d,total=d*lab.wholes,figure=LAB_FIGURES[lab.figure];
  const multiple=lab.wholes>1,active=document.getElementById('lab-active-model');
  const model=document.getElementById('lab-current-figure');
  model.className=`lab-model lab-${figure.tone}${figure.id==='strip'?' lab-strip-model':''}${multiple?' lab-multiple-wholes':''}${lab.wholes>2?' lab-many-wholes':''}`;
  const cols=lab.wholes<=3?lab.wholes:lab.wholes===4?2:3,rows=Math.ceil(lab.wholes/cols);
  model.style.setProperty('--lab-cols',cols);model.style.setProperty('--lab-rows',rows);
  model.style.setProperty('--lab-grid-aspect',cols/rows);
  model.style.setProperty('--lab-grid-adjust',((cols-1)*8-(rows-1)*8*cols/rows-(lab.wholes>2?0:16*cols))+'px');
  active.classList.toggle('lab-multi',multiple);
  active.innerHTML=multiple?Array.from({length:lab.wholes},(_,unit)=>`<div class="lab-whole" role="group" aria-label="Целое ${unit+1} из ${lab.wholes}">${labWholeSVG(figure.id,unit)}<span class="lab-unit-label" aria-hidden="true">1 целое</span></div>`).join(''):labWholeSVG(figure.id);
  root.querySelector('[data-lab-action="add-whole"]').disabled=lab.wholes>=LAB_MAX_WHOLES;
  root.querySelector('[data-lab-action="remove-whole"]').disabled=!multiple;
  document.getElementById('lab-whole-count').textContent=`Целых: ${lab.wholes} / ${LAB_MAX_WHOLES}`;
  document.getElementById('lab-figure-name').textContent=figure.label;
  document.getElementById('lab-figure-position').textContent=`${lab.figure+1} / ${LAB_FIGURES.length}`;
  root.querySelector('.lab-refinement').hidden=figure.id!=='strip';
  root.querySelector('[data-lab-action="previous-figure"]').setAttribute('aria-label',`Предыдущая фигура: ${LAB_FIGURES[(lab.figure+LAB_FIGURES.length-1)%LAB_FIGURES.length].label}`);
  root.querySelector('[data-lab-action="next-figure"]').setAttribute('aria-label',`Следующая фигура: ${LAB_FIGURES[(lab.figure+1)%LAB_FIGURES.length].label}`);
  document.getElementById('lab-line-segments').style.setProperty('--segments',total);
  document.getElementById('lab-line-segments').innerHTML=Array.from({length:total},(_,i)=>`<span data-lab-interval="${i}"></span>`).join('');
  document.getElementById('lab-line-ticks').innerHTML=Array.from({length:total+1},(_,i)=>`<i style="left:${i/total*100}%" class="${i%d===0?'edge':''}"></i>`).join('');
  document.getElementById('lab-line').max=total;
  root.querySelector('.lab-axis-labels').innerHTML=`<span style="left:0">0</span>${multiple?Array.from({length:lab.wholes-1},(_,i)=>`<span style="left:${(i+1)/lab.wholes*100}%">${i+1}</span>`).join(''):`<span id="lab-half-label" style="left:50%" ${d===1?'hidden':''}>½</span>`}<span id="lab-line-end" style="left:100%">${lab.wholes}</span>`;
  root.querySelector('.lab-axis').classList.toggle('lab-dense-axis',total>24);
  root.querySelectorAll('[data-lab-action="divide"]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.value)===d)));
  updateLab();
}
function labRelation(n,d){return n*2===d?'=':n*2<d?'&lt;':'&gt;';}
function labWholeText(n){return `${n} ${n===1?'целое':'целых'}`;}
function labValueText(){
  const n=lab.parts.size,d=lab.d,whole=Math.floor(n/d),rest=n%d;
  return whole?`${labWholeText(whole)}${rest?` и ${rest} из ${d} долей`:''}`:`${n} из ${d} долей целого`;
}
function updateLab(message){
  if(!document.getElementById('lab-n'))return;

function commitLab(parts,message){lab.parts=new Set([...parts].filter(i=>Number.isInteger(i)&&i>=0&&i<lab.d*lab.wholes));updateLab(message||labValueText()+'.');}
function changeLabWholes(direction){
  const d=lab.d;

    if(lab.wholes>=LAB_MAX_WHOLES)return;
    lab.parts=new Set([...Array.from({length:d},(_,i)=>i),...[...lab.parts].map(i=>i+d)]);lab.wholes++;
  }else{
    if(lab.wholes<=1)return;
    const counts=Array.from({length:lab.wholes},(_,unit)=>[...lab.parts].filter(i=>Math.floor(i/d)===unit).length);
    const full=counts.indexOf(d),remove=full>=0?full:counts.lastIndexOf(0);

    // the remaining value into the smaller field without dropping a fraction.
    lab.parts=remove>=0?new Set([...lab.parts].filter(i=>Math.floor(i/d)!==remove).map(i=>i>remove*d?i-d:i)):new Set(Array.from({length:lab.parts.size>d?lab.parts.size-d:lab.parts.size},(_,i)=>i));

}
function divideLab(next){
  const previous=lab.d,parts=new Set();
  for(let unit=0;unit<lab.wholes;unit++){
    const chosen=[...lab.parts].filter(i=>i>=unit*previous&&i<(unit+1)*previous).map(i=>i-unit*previous);
    const kept=next===1?[0]:chosen.length===previous?Array.from({length:next},(_,i)=>i):chosen.filter(i=>i<next);
    for(const i of kept)parts.add(unit*next+i);
  }
  lab.d=next;lab.parts=parts;if(next===1)lab.refined=false;mountLab();
}

mountLab=function(){
 const signature=[lab.figure,lab.d,lab.wholes].join('/'),changed=show.signature!==signature,oldFigure=show.signature.split('/')[0];
 if(show.ready&&changed&&!show.reduced){const source=document.getElementById('lab-active-model'),box=source.getBoundingClientRect(),stage=root.querySelector('.lab-carousel-stage'),s=stage.getBoundingClientRect(),ghost=source.cloneNode(true);ghost.removeAttribute('id');ghost.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));ghost.querySelectorAll('[tabindex]').forEach(e=>e.removeAttribute('tabindex'));ghost.className='show-ghost';ghost.setAttribute('aria-hidden','true');ghost.style.cssText=`left:${box.left-s.left}px;top:${box.top-s.top}px;width:${box.width}px;height:${box.height}px;--lab-color:${SHOW_COLORS[Number(oldFigure)||0]};`;stage.append(ghost);const anim=animate(ghost,[{opacity:.45,transform:'none',filter:'blur(0px)'},{opacity:0,transform:'translateX(-90px) rotate(-18deg) scale(.65)',filter:'blur(12px)'}],{duration:350});anim.finished.finally(()=>ghost.remove());}
 showBaseMount();show.signature=signature;document.documentElement.style.setProperty('--accent',SHOW_COLORS[lab.figure]);
 root.querySelectorAll('[data-show-figure]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.showFigure===lab.figure)));
 decorateShapes();explodeParts();
 if(changed){const hits=[...root.querySelectorAll('#lab-active-model .lab-hit')];hits.forEach((el,i)=>{const angle=i*2.4;animate(el,[{opacity:0,transform:`translate(${Math.cos(angle)*70}px,${Math.sin(angle)*55}px) rotate(${i%2?25:-25}deg) scale(.55)`},{opacity:1,transform:el.style.transform}],{duration:650,delay:Math.min(i,12)*22});});if(show.ready){chime(oldFigure!==String(lab.figure)?'switch':'divide');sparkBurst(shapeCenter(),25);}}
};

function demoState(figure,d,wholes,n){lab.figure=figure;lab.d=d;lab.wholes=wholes;lab.parts=new Set(Array.from({length:n},(_,i)=>i));lab.refined=false;show.exploded=false;mountLab();}
function stopDemo(){show.timers.forEach(clearTimeout);show.timers=[];show.playing=false;root.classList.remove('is-playing');document.getElementById('show-play-label').textContent='Включить магию';root.querySelector('[data-show="demo"]>svg').outerHTML=icon('play');document.getElementById('show-progress').style.width='0%';}
function startDemo(){
 stopDemo();show.playing=true;show.started=performance.now();show.sound=true;unlockAudio();if(show.master)show.master.gain.setTargetAtTime(.32,show.audio.currentTime,.025);syncSound();root.classList.add('is-playing');document.getElementById('show-play-label').textContent='Остановить шоу';root.querySelector('[data-show="demo"]>svg').outerHTML=icon('stop');
 const steps=[
 [0,()=>{demoState(0,1,1,1);badge('Всё начинается с целого');}],
 [1800,()=>{demoState(0,2,1,1);badge('Делим. Открываем.');}],
 [3400,()=>{show.exploded=true;explodeParts();chime('divide');}],
 [4700,()=>{show.exploded=false;explodeParts();}],
 [5500,()=>demoState(0,4,1,1)], [6500,()=>commitLab([0,1])], [7500,()=>commitLab([0,1,2])],
 [9000,()=>{demoState(1,4,1,3);badge('Форма меняется. Дробь — нет.');}],
 [11300,()=>demoState(2,4,1,3)], [13800,()=>demoState(3,4,1,3)],
 [15300,()=>{lab.refined=true;updateLab();badge('Больше долей. Та же величина.');chime('divide');}],
 [17800,()=>demoState(4,4,1,3)], [20200,()=>{demoState(0,4,1,3);changeLabWholes(1);badge('А если добавить целое?');}],
 [22000,()=>{changeLabWholes(1);}], [22700,()=>changeLabWholes(1)],
 [23400,()=>changeLabWholes(1)], [24100,()=>changeLabWholes(1)],
 [24800,()=>changeLabWholes(1)], [25500,()=>changeLabWholes(1)], [26200,()=>{changeLabWholes(1);badge('Маленькие доли. Большие открытия.');}],
 [28200,()=>{demoState(0,4,1,4);badge('Дроби. Теперь понятно.');}], [30500,()=>stopDemo()]
 ];for(const [ms,fn] of steps)show.timers.push(setTimeout(fn,ms));
}
root.addEventListener('pointerdown',event=>{unlockAudio();if(event.target.closest('[data-lab-part]'))show.lastPoint={x:event.clientX,y:event.clientY};},true);
root.addEventListener('click',event=>{if(event.target.closest('[data-lab-action],[data-show-figure],[data-show="explode"]')&&show.playing)stopDemo();},true);
root.addEventListener('input',event=>{if(event.target.id==='lab-line'&&show.playing)stopDemo();},true);
root.addEventListener('click',async event=>{
 const fig=event.target.closest('[data-show-figure]');if(fig){lab.figure=+fig.dataset.showFigure;mountLab();return;}
 const b=event.target.closest('[data-show]');if(!b)return;
 switch(b.dataset.show){
  case 'sound':show.sound=!show.sound;if(show.master)show.master.gain.setTargetAtTime(show.sound ? .32 : 0,show.audio.currentTime,.025);unlockAudio();syncSound();if(show.sound)chime();break;
  case 'portrait':show.portrait=!show.portrait;document.body.classList.toggle('show-portrait',show.portrait);b.setAttribute('aria-pressed',String(show.portrait));break;
  case 'fullscreen':try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('lab-announcement').textContent='Полноэкранный режим недоступен в этом просмотрщике.';}break;
  case 'demo':show.playing?stopDemo():startDemo();break;
  case 'explode':show.exploded=!show.exploded;explodeParts();chime('divide');badge(show.exploded?'У каждой доли — своё место':'Снова одно целое');break;
 }
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){stopDemo();if(show.portrait){show.portrait=false;document.body.classList.remove('show-portrait');root.querySelector('[data-show="portrait"]').setAttribute('aria-pressed','false');}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopDemo();show.audio?.suspend();}else if(show.sound&&show.audio)show.audio.resume().catch(()=>{});});

function startParticles(){
 const canvas=document.getElementById('show-canvas'),ctx=canvas.getContext('2d');let w=0,h=0,last=0;
 const stars=Array.from({length:34},(_,i)=>({x:Math.random(),y:Math.random(),size:i%5===0?1.5:.7,phase:Math.random()*6}));
 function resize(){show.particles=[];w=innerWidth;h=innerHeight;const ratio=Math.min(devicePixelRatio||1,1.5);canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);}
 addEventListener('resize',resize);resize();
 function frame(t){const dt=Math.min((t-last)/16.67,2);last=t;ctx.clearRect(0,0,w,h);
  if(!show.reduced){for(const star of stars){ctx.globalAlpha=.12+(.5+.5*Math.sin(t*.0004+star.phase))*.25;ctx.fillStyle='#cdd3f4';ctx.beginPath();ctx.arc(star.x*w,(star.y*h+t*.002*(star.size/2))%h,star.size,0,Math.PI*2);ctx.fill();}
   for(const p of show.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.025*dt;p.vx*=.98;p.life-=.016*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();if(p.star){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*2);ctx.rect(-p.size/2,-p.size*2,p.size,p.size*4);ctx.rect(-p.size*2,-p.size/2,p.size*4,p.size);ctx.fill();ctx.restore();}else{ctx.arc(p.x,p.y,p.size*Math.max(0,p.life),0,Math.PI*2);ctx.fill();}}
   show.particles=show.particles.filter(p=>p.life>0);ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  if(show.playing)document.getElementById('show-progress').style.width=Math.min(100,(t-show.started)/305)+'%';requestAnimationFrame(frame);
 }requestAnimationFrame(frame);
}
root.innerHTML=renderShow();mountLab();show.ready=true;syncSound();startParticles();
</script>
